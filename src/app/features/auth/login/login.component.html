<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-circle">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2>Welcome Back</h2>
      <p>Log in to access your MCQs and Online Tests</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-envelope icon"></i>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="student@example.com"
            class="form-control"
            [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
          />
        </div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error-text">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <div class="password-label-wrapper">
          <label for="password">Password</label>
        </div>
        <div class="input-with-icon">
          <i class="fa-solid fa-key icon"></i>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="form-control"
            [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-text">
          Password must be at least 6 characters.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="!loading">Sign In <i class="fa-solid fa-arrow-right"></i></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    </div>
  </div>
</div>
